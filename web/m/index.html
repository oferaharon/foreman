<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- `viewport-fit=cover` is what makes `env(safe-area-inset-*)` non-zero on a notched
         iPhone; without it the composer and the list's last row sit under the home
         indicator. `initial-scale=1` with no `maximum-scale` on purpose — pinch-zoom is an
         accessibility control and is not ours to take away. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#111219" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f5f8" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-title" content="Leads" />
    <title>Leads · Foreman</title>

    <!--
      The palette, and *only* the palette. `web/styles.css` is deliberately not linked here:
      `body { overflow: hidden }` and `.app { grid-template-columns: 20rem 1fr; height: 100vh }`
      would each break a phone on their own. `web/tokens.css` is the shared file both pages
      link so the colours cannot drift into two sources of truth.
    -->
    <link rel="stylesheet" href="/tokens.css" />

    <!--
      One stylesheet per scope, each owned by exactly one build item, all five linked here
      once. This file is written by item 5 and no later item edits it — that is what stops
      items 6, 7 and 8 colliding in a shared <head>.
    -->
    <link rel="stylesheet" href="/m/m.css" />
    <link rel="stylesheet" href="/m/lead.css" />
    <link rel="stylesheet" href="/m/cards.css" />
    <link rel="stylesheet" href="/m/tasks.css" />

    <!--
      Its own app, not the desktop panel's: `id` and `scope` are `/m/`, and the icon is the
      leads variant of the same mark — one row with two indented under it — so the two sit
      apart on a Home Screen rather than being told apart by their titles. `display:
      standalone` in the manifest is what "Add to Home Screen" reads; the
      `apple-mobile-web-app-*` metas above and below are what older iOS reads for the same
      thing, which is why both are here.

      No notifications reach this view and none is offered. `Notification` needs a secure
      context, a phone reaches the panel over plain http on the LAN, and a Home Screen web
      app would need a push service besides — see the note over `web/notify.js`. The
      Home Screen icon is what this half of the issue was for.
    -->
    <link rel="manifest" href="/m/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!--
      `black`, not `black-translucent`. The translucent one is the prettier answer and would
      probably work — this view is already built for `viewport-fit=cover` and reads
      `safe-area-inset-top` in two places — but it is the one value that moves the layout,
      by putting the page *under* the status bar, and there is no way to check that from
      this bench. `black` gives a near-`--ground` bar and changes nothing. Worth revisiting
      with a phone in hand, which is the only place the difference is visible.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />

    <link rel="icon" type="image/svg+xml" href="/icons/leads.svg" />
    <link rel="apple-touch-icon" href="/icons/leads-apple-touch-icon.png" />
  </head>
  <body>
    <div class="m-app" id="app"></div>
    <script type="module" src="/m/app.js"></script>
  </body>
</html>
