<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>Foreman</title>
    <link rel="stylesheet" href="/tokens.css" />
    <link rel="stylesheet" href="/styles.css" />

    <!--
      Installed to the Dock from Safari's "Add to Dock" or Chrome's "Install app", which
      both read this manifest. Its `id` is `/` and the phone view's is `/m/`, deliberately:
      two apps on one origin that share an id are one app to a browser, and installing the
      second would silently replace the first.

      `theme-color` is the dark `--ground` from `tokens.css`, spelled twice with a media
      query so a light-mode Mac gets the light ground rather than a dark bar over a light
      page. The manifest's own `theme_color` takes no media query and is dark, which is the
      right single answer here — the light theme stays defined and unbroken, it is just not
      the one this is tuned for. Copy the values, don't invent new ones: they are the same
      two `--ground`s the stylesheet paints with.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#111219" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f5f8" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-title" content="Foreman" />

    <!--
      The mark is generated — `npm run icons`, from `scripts/make-icons.mjs`, which is the
      only description of it. The SVG is what a modern browser uses; the 32px PNG is the
      fallback for one that will not take an SVG favicon.
    -->
    <link rel="icon" type="image/svg+xml" href="/icons/mark.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  </head>
  <body>
    <div class="app" id="app" data-view="main">
      <aside class="rail">
        <div class="rail-head">
          <div class="brand">
            Foreman
            <span class="link" id="conn">●</span>
          </div>
          <div class="rail-stat" id="railStat"></div>

          <!--
            The account's two subscription gauges — the five-hour window and the seven-day
            one — filled by `renderQuota`. Empty in the markup and empty on screen until a
            status line has actually posted something: no record means no bars at all,
            never a zero and never a grey placeholder.

            In `.rail-head`, after the stats and before the buttons, and that placement is
            the whole of what makes it cheap. The head takes its own content height in the
            rail's column while `.rail-list` is `flex: 1` with `min-height: 0` and its own
            `overflow-y`, so a band up here costs the list a row of height and nothing else
            — the same trade the `.rail-actions` rule below already writes down for its own
            second line of buttons. Inside the list it would have to
            answer to two things that are measured against the rows around them: the sticky
            `.folder-label.in-group { top: 2.5rem }` offset, and an open group's tint, which
            is tiled from three full-width rows *in that flow*. That is the reason the
            connections band and the footer further down are siblings of the list rather
            than blocks inside it, and it is the reason for this one too.
          -->
          <div class="rail-quota" id="railQuota"></div>

          <div class="rail-actions">
            <button class="new-session" id="newSession" title="Start a new Claude session">+ new</button>
            <button class="new-session" id="snapshot" title="Save this set of sessions, or put it back">
              snapshot
            </button>
            <button class="new-session rail-toggle" id="flatRail" aria-pressed="false">recent</button>
            <button class="new-session" id="settings" title="Who can reach this panel, and which browsers may write to it">settings</button>
          </div>
        </div>
        <div class="rail-list" id="railList"></div>

        <!--
          The shared room: one row, always here, above the connections band.

          It is a *row* rather than a card because there is exactly one of it — the machine
          has one room, however many sessions are on it — and a band that can hold only one
          card is a band that should have been a row. It is persistent for the same reason:
          the connections band shows and hides with `.app.has-links` because a panel with no
          links should be the panel it was before that feature, but a room with nothing in
          it yet still has something to say (`renderShared`'s empty line says it), and a
          control that only appears once traffic exists is a control nobody discovers.

          A sibling of `.rail-list`, never a block inside it — an open group's tint is tiled
          from three full-width rows in that list, and anything joining that flow has to
          answer to it. Out here it is one more band in the rail's own flex column. The
          unseen count is filled by `renderSharedRow` off the roster frame's `sharedRoom`
          summary; the log itself never rides that frame.
        -->
        <button class="rail-shared" id="railShared" type="button">
          <span class="rail-shared-mark" aria-hidden="true">⁂</span>
          <span class="rail-shared-name">shared room</span>
          <span class="rail-shared-unseen" id="railSharedUnseen" hidden></span>
        </button>

        <!--
          The connections: one card per open link, at the bottom of the rail under the
          session list. It was a column of its own for one day; the maintainer moved it
          here — same content, new home.

          A **sibling** of `.rail-list`, never a block inside it, for the reason the footer
          below says in its own words: an open group's tint is tiled from three full-width
          rows *in that list*, and anything joining that flow has to answer to it. Out here
          it is simply another band in the rail's own flex column, and the tint has nothing
          to know about.

          In the markup always, on screen only while at least one open link exists —
          `.app.has-links` is what shows it, the same show/hide trade `.app.split .main`
          already makes. With no links the rail is what it was before this feature. The
          narrow query hides the whole rail, so this comes for free there.

          The grip is the Tasks/Room divider's twin, down to the negative margins: a row
          divider between two blocks that simply meet, with nothing to hang it off. It is
          a sibling above the block rather than a child of it, because that is where the
          edge it drags actually is.
        -->
        <div
          class="pane-grip grip-row conn-grip"
          id="connGrip"
          role="separator"
          aria-orientation="horizontal"
          aria-label="Connections height"
          title="Drag to set how much of the rail the connections take · double-click to reset"
        ></div>
        <aside class="rail-conn" id="connCol" aria-label="Connections">
          <div class="conn-head">connections</div>
          <div class="conn-list" id="connList"></div>
        </aside>

        <!-- A sibling of the list, never inside it: an open group's tint is tiled from
             three full-width rows in `.rail-list`, and anything joining that flow would
             have to answer to it. Out here the footer is just the last thing in the
             column. The href and the version text are filled from `GET /api/config` at
             boot — `web/` may not carry a second copy of what `package.json` says. -->
        <div class="rail-foot">
          <a class="rail-repo" id="railRepo" rel="noreferrer noopener" target="_blank">
            <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true" focusable="false">
              <path
                fill="currentColor"
                d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8Z"
              />
            </svg>
            <span class="rail-repo-name">GitHub</span>
          </a>
          <span class="rail-version" id="railVersion"></span>
        </div>

        <!-- The rail's right edge. Last in the column so it paints over the footer and
             the list; positioned against `.rail`, which is what gives it the full height.
             `pane-grip grip-col` is the shared divider (see `resizer` in app.js); the
             lead aside builds its two the same way, in script. -->
        <div
          class="pane-grip grip-col rail-grip"
          id="railGrip"
          role="separator"
          aria-orientation="vertical"
          aria-label="Rail width"
          title="Drag to set the rail's width · double-click to reset"
        ></div>
      </aside>

      <!--
        The frame the panes sit in, and — between them, in split view only — the fifth
        grip. It is a child of the frame rather than of either pane because the edge it
        drags belongs to neither: it is the line the grid's two tracks meet at, placed from
        the same `--pane-a` that sizes the first track. Absolutely positioned, so it is not
        a grid item and adding it cost the split nothing; the panes are appended after it
        and removed from under it, and it neither notices nor cares.
      -->
      <main class="main" id="main">
        <div
          class="pane-grip grip-col split-grip"
          id="splitGrip"
          role="separator"
          aria-orientation="vertical"
          aria-label="Split width"
          title="Drag to set how the two panes divide · double-click to reset"
        ></div>
      </main>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
